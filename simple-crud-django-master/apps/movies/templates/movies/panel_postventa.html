{% extends 'movies/fragments/base.html' %}

{% block main-content %}
<div class="netflix-wrapper">
    <div class="netflix-card" style="max-width: 650px;">
        
        <!-- Título principal dentro de la tarjeta -->
        <h2>Panel de Ejecutivo de Postventa</h2>
        
        <!-- Mensaje de bienvenida / subtítulo -->
        <p style="color: #b3b3b3; margin-bottom: 25px; font-size: 0.95rem;">
            Bienvenido, {{ request.user.username }}. Gestión de solicitudes, evidencias y devoluciones.
        </p>

        <!-- Línea divisoria estilo Netflix -->
        <hr style="border: none; border-top: 1px solid #333; margin-bottom: 25px;">

        <!-- Sección de Acciones de Postventa -->
        <div style="margin-bottom: 20px;">
            <h4 style="color: #ffffff; font-size: 1.1rem; font-weight: 600; margin-bottom: 15px;">
                Acciones de Operación
            </h4>
            
            <!-- Botón 1: Revisar Solicitudes -->
            <div style="margin-bottom: 12px;">
                <a href="{% url 'movies:revisar-solicitudes' %}" class="btn" style="background-color: #222; border: 1px solid #444; color: #fff; display: inline-flex; align-items: center; padding: 12px 20px; border-radius: 4px; text-decoration: none; width: 100%; box-sizing: border-box;">
                    📋 Revisar Solicitudes
                </a>
            </div>

            <!-- Botón 2: Validar Evidencia -->
            <div style="margin-bottom: 12px;">
                <a href="{% url 'movies:validar-evidencia' %}" class="btn" style="background-color: #222; border: 1px solid #444; color: #fff; display: inline-flex; align-items: center; padding: 12px 20px; border-radius: 4px; text-decoration: none; width: 100%; box-sizing: border-box;">
                    🔍 Validar Evidencia
                </a>
            </div>

            <!-- Botón 3: Autorizar Devoluciones -->
            <div style="margin-bottom: 15px;">
                <a href="{% url 'movies:autorizar-devoluciones' %}" class="btn" style="background-color: #222; border: 1px solid #444; color: #fff; display: inline-flex; align-items: center; padding: 12px 20px; border-radius: 4px; text-decoration: none; width: 100%; box-sizing: border-box;">
                    📦 Autorizar Devoluciones
                </a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
