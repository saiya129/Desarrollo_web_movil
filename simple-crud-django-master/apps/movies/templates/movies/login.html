{% extends 'movies/fragments/base.html' %}

{% block main-content %}
<!-- Tipografía estilo Netflix -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
    /* Ocultar la barra de navegación exclusivamente en el login */
    nav, .netflix-nav {
        display: none !important;
    }

    /* Fondo estilo Netflix */
    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.5) 60%, rgba(0, 0, 0, 0.85) 100%),
                    url('https://assets.nflxext.com/ffe/siteui/vlv3/ab73938e-d2f0-4558-be3a-911f4803732/web/CL-es-20240715-POP-mhs-perspective_alpha_website_large.jpg');
        background-size: cover !important;
    }

    /* Contenedor centrado específico para el login */
    .netflix-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        padding: 20px;
        width: 100%;
    }

    /* Tarjeta flotante estilo Netflix */
    .netflix-card {
        background: rgba(0, 0, 0, 0.75) !important;
        border-radius: 8px;
        padding: 40px 50px !important;
        width: 400px !important;
        max-width: 90vw !important;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
    }

    .netflix-card h2 {
        color: #ffffff;
        font-size: 2rem;
        font-weight: 700;
        margin-top: 0;
        margin-bottom: 25px;
        text-align: center;
    }

    .input-field {
        margin-bottom: 20px;
    }

    .input-field input {
        width: 100%;
        padding: 14px;
        background: #333;
        border: 1px solid #555;
        color: white;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 1rem;
    }

    .input-field input:focus {
        border-color: #e50914;
        outline: none;
        background: #454545;
    }

    .btn-netflix {
        background-color: #e50914;
        border: none;
        width: 100%;
        padding: 14px;
        color: white;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 10px;
        font-size: 1rem;
    }

    .btn-netflix:hover {
        background-color: #f40612;
    }

    .alert-error {
        background-color: #e50914;
        color: white;
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 20px;
        font-size: 0.9rem;
        text-align: center;
    }
</style>

<div class="netflix-wrapper">
    <div class="netflix-card">
        <h2>Iniciar Sesión</h2>

        {% if error %}
            <div id="error-box" class="alert-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" id="login-form">
            {% csrf_token %}
            
            <div class="input-field">
                <input type="text" name="username" id="username" required autocomplete="username" placeholder="Usuario o correo electrónico">
            </div>

            <div class="input-field">
                <input type="password" name="password" id="password" required autocomplete="current-password" placeholder="Contraseña">
            </div>

            <button type="submit" class="btn-netflix">ENTRAR</button>
        </form>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', (event) => {
        if (performance.navigation.type === 1 || window.location.search === "") {
            const errorBox = document.getElementById('error-box');
        }
    });
</script>

{% endblock %}
