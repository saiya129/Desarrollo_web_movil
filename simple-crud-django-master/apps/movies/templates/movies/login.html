{% extends 'movies/fragments/base.html' %}

{% block main-content %}
<!-- Tipografía estilo Netflix desde Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
  /* 1. Ocultar la barra de navegación en la pantalla de login */
  nav, .netflix-nav {
    display: none !important;
  }

  /* 2. Fondo estilo Netflix */
  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.5) 60%, rgba(0, 0, 0, 0.85) 100%),
                url('https://assets.nflxext.com/ffe/siteui/vlv3/ab73938e-d2f0-4558-be3a-9111f4803732/web/CL-es-20240715-POP-mhs-perspective_alpha_website_large.jpg') no-repeat center center fixed !important;
    background-size: cover !important;
  }

  /* 3. Contenedor centrado */
  .netflix-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* 4. Tarjeta flotante estilo Netflix */
  .netflix-card {
    background: rgba(0, 0, 0, 0.75) !important;
    border-radius: 8px;
    padding: 40px 50px !important;
    width: 500px !important;     /* <--- Forzamos un ancho fijo exacto */
    max-width: 90vw !important;  /* <--- Evita que se desborde en pantallas chicas */
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(4px);
    will-change: transform, opacity, filter;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1) !important;
}

  .netflix-card h2 {
    color: #ffffff;
    font-size: 2rem;
    font-weight: 700;
    margin-top: 0;
    margin-bottom: 25px;
  }

  /* 5. Corrección definitiva para separar la etiqueta flotante y el input */
  .netflix-card .input-field {
    position: relative;
    margin-top: 35px !important;
    margin-bottom: 20px !important;
  }

  .netflix-card .input-field label {
    position: absolute !important;
    top: -25px !important;
    left: 0 !important;
    font-size: 0.9rem !important;
    color: #b3b3b3 !important;
    transform: none !important;
  }

  .netflix-card .input-field input {
    background: transparent !important;
    color: #ffffff !important;
    border-bottom: 1px solid #808080 !important;
  }

  .netflix-card .input-field input:focus {
    border-bottom: 1px solid #e50914 !important;
    box-shadow: none !important;
  }

  /* 6. Regla de salida cinemática al enviar el formulario */
  .cinematic-exit {
    opacity: 0 !important;
    transform: scale(0.92) translateY(-10px) !important;
    filter: blur(12px) !important;
  }
</style>

<div class="netflix-wrapper">
  <div class="netflix-card">
    <h2>Iniciar Sesión</h2>

    <!-- Mensajes de alerta de Django si existen -->
    {% if message %}
      <div class="card-panel red darken-2" style="border-radius: 4px; padding: 10px;">
        <span class="white-text">{{ message }}</span>
      </div>
    {% endif %}

    <!-- Formulario de Login -->
    {% include 'movies/fragments/forms.html' %}
  </div>
</div>

<!-- Script de captura y animación -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const loginForm = document.querySelector('form');
    const submitBtn = document.querySelector('button[type="submit"], input[type="submit"]');
    const card = document.querySelector('.netflix-card');

    function triggerTransitionAndSubmit(e) {
      if (e) e.preventDefault();
      
      // Aplicamos el desenfoque cinemático a la tarjeta
      if (card) {
        card.classList.add('cinematic-exit');
      }

      // Damos 350ms para apreciar la animación antes de enviar
      setTimeout(function() {
        if (loginForm) {
          loginForm.submit();
        } else if (submitBtn && submitBtn.form) {
          submitBtn.form.submit();
        }
      }, 350);
    }

    if (loginForm) {
      loginForm.addEventListener('submit', triggerTransitionAndSubmit);
    } else if (submitBtn) {
      submitBtn.addEventListener('click', triggerTransitionAndSubmit);
    }
  });
</script>

{% endblock %}
