{% csrf_token %}

{% if error %}
    <div class="alert alert-danger py-2 small mb-3" style="background-color: #e50914; color: white; border: none; padding: 10px; border-radius: 4px;">
        {{ error }}
    </div>
{% endif %}

<div class="input-field mb-3" style="position: relative; margin-top: 20px;">
    <label for="username" style="display: block; color: #b3b3b3; margin-bottom: 8px; font-size: 0.9rem;">Usuario</label>
    <input type="text" name="username" id="username" class="form-control" required style="width: 100%; padding: 10px; background: #333; border: 1px solid #555; color: white; border-radius: 4px;">
</div>

<div class="input-field mb-4" style="position: relative; margin-top: 20px;">
    <label for="password" style="display: block; color: #b3b3b3; margin-bottom: 8px; font-size: 0.9rem;">Contraseña</label>
    <input type="password" name="password" id="password" class="form-control" required style="width: 100%; padding: 10px; background: #333; border: 1px solid #555; color: white; border-radius: 4px;">
</div>

<button type="submit" class="btn btn-danger w-100 py-2 fw-bold" style="background-color: #e50914; border: none; width: 100%; padding: 12px; color: white; font-weight: bold; border-radius: 4px; cursor: pointer;">ENTRAR</button>
