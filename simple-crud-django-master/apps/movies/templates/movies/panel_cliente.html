{% extends 'movies/fragments/base.html' %}
{% block main-content %}
<div class="netflix-wrapper" style="background: #141414; min-height: 85vh; display: flex; justify-content: center; align-items: center; padding: 40px 20px;">
    <div class="netflix-card" style="background: rgba(20, 20, 20, 0.95); border: 1px solid #333; border-radius: 8px; padding: 50px 40px; width: 100%; max-width: 700px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); text-align: center;">
        
        <!-- Encabezado Estilo Netflix -->
        <h1 style="color: #e50914; font-weight: 700; font-size: 30px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;">Área de Clientes</h1>
        <p style="color: #b3b3b3; font-size: 15px; margin-bottom: 40px;">Bienvenido. Desde aquí puedes gestionar tus devoluciones, cambios y dar seguimiento a tus solicitudes.</p>
        
        <!-- Botones de Acción Principales -->
        <div style="display: flex; flex-direction: column; gap: 20px; max-width: 450px; margin: 0 auto;">
            
            <!-- Botón Crear Solicitud -->
            <a href="{% url 'movies:crear_solicitud' %}" class="btn red darken-3" style="background-color: #e50914 !important; padding: 15px 30px; font-weight: bold; border-radius: 4px; font-size: 16px; text-transform: uppercase; text-decoration: none; color: white; transition: background 0.2s; box-shadow: 0 4px 12px rgba(229,9,20,0.4); display: flex; align-items: center; justify-content: center;">
                + Crear Nueva Solicitud
            </a>
            
            <!-- Botón Consultar Estado -->
            <a href="{% url 'movies:consultar_estado_solicitudes' %}" class="btn grey darken-2" style="background-color: #222 !important; border: 1px solid #444; padding: 14px 20px; min-height: 56px; line-height: 1.3; font-weight: bold; border-radius: 4px; font-size: 15px; text-transform: uppercase; text-decoration: none; color: #fff; display: flex; align-items: center; justify-content: center; transition: background 0.2s; text-align: center; word-break: break-word;">
                Consultar Estado de <br>Mis Solicitudes
            </a>
            
        </div>

    </div>
</div>
{% endblock %}
